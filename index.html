<!DOCTYPE html>
<html lang="en" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta http-equiv="X-UA-Compatible" content="ie=edge">
  
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  
  <meta name="referrer" content="no-referrer">
  <meta name="theme-color" id="meta-theme-color" content="#09090b">
  <title>Broadway4U Movies - Free Movies & TV</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          colors: {
            brand: { 50: '#fef2f2', 500: '#ef4444', 600: '#dc2626', 700: '#b91c1c', 900: '#7f1d1d' }
          },
          screens: {
            'xs': '420px',
            '3xl': '1800px',
          },
          animation: {
            'fade-in': 'fadeIn 0.5s ease-out forwards',
            'slide-up': 'slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards',
            'pulse-slow': 'pulse 3s cubic-bezier(0.4, 0, 0.6, 1) infinite',
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }

    if (localStorage.getItem('theme') === 'light' || (!('theme' in localStorage) && window.matchMedia('(prefers-color-scheme: light)').matches)) {
      document.documentElement.classList.remove('dark');
      document.getElementById('meta-theme-color')?.setAttribute('content', '#f9fafb');
    } else {
      document.documentElement.classList.add('dark');
    }
  </script>
  
  <style>
    .no-scrollbar::-webkit-scrollbar { display: none; }
    .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
    
    .custom-scroll::-webkit-scrollbar { width: 6px; height: 6px; }
    .custom-scroll::-webkit-scrollbar-track { background: transparent; }
    .custom-scroll::-webkit-scrollbar-thumb { background: #d4d4d8; border-radius: 9999px; }
    .dark .custom-scroll::-webkit-scrollbar-thumb { background: #3f3f46; }
    .custom-scroll::-webkit-scrollbar-thumb:hover { background: #ef4444; }
    .dark .custom-scroll::-webkit-scrollbar-thumb:hover { background: #dc2626; }

    body {
      -webkit-tap-highlight-color: transparent;
      overflow-x: hidden;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      transition: background-color 0.3s ease, color 0.3s ease;
      padding-left: env(safe-area-inset-left);
      padding-right: env(safe-area-inset-right);
      padding-bottom: env(safe-area-inset-bottom);
    }

    .glass-panel {
      background: rgba(255, 255, 255, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 0, 0, 0.05);
    }
    .dark .glass-panel {
      background: rgba(18, 18, 20, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.08);
    }

    .glass-nav {
      background: rgba(249, 250, 251, 0.9);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
    }
    .dark .glass-nav { background: rgba(9, 9, 11, 0.9); }

    .media-card {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), box-shadow 0.4s ease;
      cursor: pointer;
    }
    .media-card.animate-in { animation: slideUp 0.6s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .media-card:hover {
      transform: translateY(-6px) scale(1.03);
      box-shadow: 0 15px 35px -10px rgba(220, 38, 38, 0.4);
      z-index: 10;
    }

    #player-modal { transition: opacity 0.3s ease, visibility 0.3s ease; }
    .modal-content {
      transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.4s ease;
      transform: scale(0.95) translateY(15px);
      opacity: 0;
    }
    .modal-active .modal-content {
      transform: scale(1) translateY(0);
      opacity: 1;
    }

    .hero-glow { background: radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.08) 0%, rgba(249, 250, 251, 0) 70%); }
    .dark .hero-glow { background: radial-gradient(circle at 50% 0%, rgba(220, 38, 38, 0.18) 0%, rgba(9, 9, 11, 0) 70%); }

    .pulse-glow { animation: pulseGlow 2s infinite; }
    @keyframes pulseGlow {
      0%, 100% { opacity: 1; filter: drop-shadow(0 0 5px rgba(34, 197, 94, 0.6)); }
      50% { opacity: 0.6; filter: drop-shadow(0 0 1px rgba(34, 197, 94, 0.2)); }
    }
    
    .episode-card.active {
        border-color: #ef4444;
        background-color: rgba(239, 68, 68, 0.1);
    }
    .dark .episode-card.active {
        border-color: #dc2626;
        background-color: rgba(220, 38, 38, 0.2);
    }

    #player-wrapper:fullscreen { max-height: 100vh !important; border: none !important; border-radius: 0 !important; }
    #player-wrapper:-webkit-full-screen { max-height: 100vh !important; border: none !important; border-radius: 0 !important; }
    #player-wrapper:-moz-full-screen { max-height: 100vh !important; border: none !important; border-radius: 0 !important; }
  </style>
</head>

<body class="min-h-screen bg-gray-50 dark:bg-zinc-950 text-gray-900 dark:text-zinc-100 flex flex-col selection:bg-red-600 selection:text-white antialiased">

  <nav class="fixed top-0 w-full z-40 glass-nav border-b border-gray-200 dark:border-zinc-800/80 transition-all duration-300">
    <div class="max-w-[1800px] mx-auto flex flex-col w-full">
      
      <!-- Top Row: Logo & Icons -->

        <!-- Mobile specific Quick Icons -->

          </button>

            <button id="toggle-movie-desktop" onclick="switchMediaType('movie')" class="px-4 py-1.5 rounded-lg text-gray-500 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white transition-all active:scale-95">Movies</button>
            <button id="toggle-tv-desktop" onclick="switchMediaType('tv')" class="px-4 py-1.5 rounded-lg text-gray-500 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white transition-all active:scale-95">TV Shows</button>
          </div>
          <button onclick="toggleListsSection()" class="flex items-center gap-2 bg-white dark:bg-zinc-900/80 border border-gray-200 dark:border-zinc-800 hover:border-gray-300 dark:hover:border-zinc-700 px-4 py-2 rounded-xl text-sm font-bold text-gray-700 dark:text-zinc-300 hover:text-gray-900 dark:hover:text-white transition-all shadow-sm active:scale-95">
            <svg class="w-4 h-4 text-red-500" fill="currentColor" viewBox="0 0 24 24"><path d="M12 21.35l-1.45-1.32C5.4 15.36 2 12.28 2 8.5 2 5.42 4.42 3 7.5 3c1.74 0 3.41.81 4.5 2.09C13.09 3.81 14.76 3 16.5 3 19.58 3 22 5.42 22 8.5c0 3.78-3.4 6.86-8.55 11.54L12 21.35z"/></svg> My Lists
          </button>
          <button onclick="toggleTheme()" class="flex items-center justify-center bg-white dark:bg-zinc-900/80 border border-gray-200 dark:border-zinc-800 w-10 h-10 rounded-xl text-gray-600 dark:text-zinc-300 hover:text-gray-900 dark:hover:text-white transition-all shadow-sm active:scale-95">
            <svg id="theme-icon-desktop" class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/></svg>
          </button>
        </div>
      </div>

      <!-- Middle Row: Mobile Filters & Universal Search -->
      <div class="px-4 sm:px-6 lg:px-8 pb-3 flex flex-col md:flex-row items-center justify-between gap-3 w-full border-b border-gray-200/50 dark:border-zinc-800/30 md:border-none">
        
        <!-- Mobile only: Movies/TV Toggle -->
        <div class="flex md:hidden w-full bg-white dark:bg-zinc-900/90 p-1 rounded-xl border border-gray-200 dark:border-zinc-800 text-sm font-bold shadow-sm justify-between">
          <button id="toggle-all-mobile" onclick="switchMediaType('all')" class="flex-1 px-3 py-2 rounded-lg bg-red-600 text-white shadow-sm transition-all active:scale-95 text-center">All</button>
          <button id="toggle-movie-mobile" onclick="switchMediaType('movie')" class="flex-1 px-3 py-2 rounded-lg text-gray-500 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white transition-all active:scale-95 text-center">Movies</button>
          <button id="toggle-tv-mobile" onclick="switchMediaType('tv')" class="flex-1 px-3 py-2 rounded-lg text-gray-500 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white transition-all active:scale-95 text-center">TV</button>
        </div>

        <!-- Universal Search Bar -->
        <div class="flex items-center gap-2 bg-white dark:bg-zinc-900/90 border border-gray-200 dark:border-zinc-800 focus-within:border-red-600 focus-within:ring-2 focus-within:ring-red-600/30 rounded-xl px-4 py-2.5 w-full md:w-80 lg:w-96 md:ml-auto transition-all shadow-sm group">
          <svg class="w-5 h-5 text-gray-400 dark:text-zinc-500 group-focus-within:text-red-500 transition-colors shrink-0" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path></svg>
          <input id="search-input" type="text" placeholder="Search titles..." class="bg-transparent border-none outline-none text-sm w-full text-gray-900 dark:text-white placeholder-gray-400 dark:placeholder-zinc-500 font-medium" onkeyup="handleSearch(event)">
        </div>
      </div>

      <!-- Bottom Row: Genres (Scrollable) -->
      <div class="px-4 sm:px-6 lg:px-8 py-2.5 flex gap-2 overflow-x-auto no-scrollbar text-sm font-semibold border-t border-gray-200/80 dark:border-zinc-800/50 touch-pan-x w-full">

        <button type="button" onclick="filterByGenre('28', this)" class="genre-pill text-gray-600 dark:text-zinc-400 bg-white dark:bg-zinc-900/60 border border-gray-200 dark:border-zinc-700 px-5 py-2 rounded-full shrink-0 hover:bg-gray-50 dark:hover:bg-zinc-800 hover:text-gray-900 dark:hover:text-white transition-transform duration-200 active:scale-90 shadow-sm cursor-pointer select-none whitespace-nowrap">Action</button>
        <button type="button" onclick="filterByGenre('878', this)" class="genre-pill text-gray-600 dark:text-zinc-400 bg-white dark:bg-zinc-900/60 border border-gray-200 dark:border-zinc-700 px-5 py-2 rounded-full shrink-0 hover:bg-gray-50 dark:hover:bg-zinc-800 hover:text-gray-900 dark:hover:text-white transition-transform duration-200 active:scale-90 shadow-sm cursor-pointer select-none whitespace-nowrap">Sci-Fi</button>
        <button type="button" onclick="filterByGenre('35', this)" class="genre-pill text-gray-600 dark:text-zinc-400 bg-white dark:bg-zinc-900/60 border border-gray-200 dark:border-zinc-700 px-5 py-2 rounded-full shrink-0 hover:bg-gray-50 dark:hover:bg-zinc-800 hover:text-gray-900 dark:hover:text-white transition-transform duration-200 active:scale-90 shadow-sm cursor-pointer select-none whitespace-nowrap">Comedy</button>
        <button type="button" onclick="filterByGenre('27', this)" class="genre-pill text-gray-600 dark:text-zinc-400 bg-white dark:bg-zinc-900/60 border border-gray-200 dark:border-zinc-700 px-5 py-2 rounded-full shrink-0 hover:bg-gray-50 dark:hover:bg-zinc-800 hover:text-gray-900 dark:hover:text-white transition-transform duration-200 active:scale-90 shadow-sm cursor-pointer select-none whitespace-nowrap">Horror</button>
        <button type="button" onclick="filterByGenre('18', this)" class="genre-pill text-gray-600 dark:text-zinc-400 bg-white dark:bg-zinc-900/60 border border-gray-200 dark:border-zinc-700 px-5 py-2 rounded-full shrink-0 hover:bg-gray-50 dark:hover:bg-zinc-800 hover:text-gray-900 dark:hover:text-white transition-transform duration-200 active:scale-90 shadow-sm cursor-pointer select-none whitespace-nowrap">Drama</button>

      </div>

  <main class="max-w-[1800px] mx-auto flex-grow w-full pb-20 transition-[padding] duration-300">
    
    <!-- Loading Spinner -->
    <div id="loading-indicator" class="fixed top-1/2 left-1/2 transform -translate-x-1/2 -translate-y-1/2 z-50">
      <div class="glass-panel p-6 sm:p-8 rounded-3xl flex flex-col items-center gap-4 shadow-2xl border border-gray-200 dark:border-zinc-800">
        <div class="animate-spin rounded-full h-12 w-12 border-4 border-red-600 border-t-transparent shadow-lg"></div>
        <span class="text-sm font-bold text-gray-500 dark:text-zinc-400 tracking-wider uppercase animate-pulse">Loading Magic...</span>
      </div>
    </div>

    <!-- Error container -->
    <div id="error-container" class="hidden pt-20 px-4 text-center">
      <div class="glass-panel p-8 rounded-3xl max-w-md mx-auto shadow-2xl border border-red-200 dark:border-red-900/30">
        <svg class="w-16 h-16 text-red-500 mx-auto mb-4 animate-bounce" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>

      </div>
    </div>

        <div>
          <h2 id="search-title" class="text-2xl sm:text-3xl font-black tracking-tight flex items-center gap-2 text-gray-900 dark:text-white">Search Results</h2>

          <button id="tab-favorites" onclick="switchListTab('favorites')" class="flex-1 sm:flex-none px-6 py-2.5 rounded-lg text-gray-500 dark:text-zinc-400 hover:text-gray-900 dark:hover:text-white transition-all active:scale-95 text-center">Favorites <span class="text-red-500 ml-1">❤</span></button>

        <h3 id="current-list-title" class="text-lg sm:text-xl font-bold text-gray-800 dark:text-gray-200">Your Watchlist</h3>
        <button onclick="requestClearList()" class="text-xs sm:text-sm font-bold text-gray-500 dark:text-zinc-400 hover:text-red-600 transition-colors bg-gray-100 dark:bg-zinc-900 px-4 py-2 rounded-lg border border-gray-200 dark:border-zinc-800 active:scale-95">Clear List</button>
      </div>
      <div id="lists-grid" class="grid grid-cols-2 xs:grid-cols-3 sm:grid-cols-4 md:grid-cols-5 lg:grid-cols-6 xl:grid-
